name: mixpanel_devtools
description: A Flutter DevTools extension to inspect, filter, and export the Mixpanel events of a running app.
version: 0.2.1
repository: https://github.com/pratikpwr/mixpanel_devtools
issue_tracker: https://github.com/pratikpwr/mixpanel_devtools/issues

topics:
  - mixpanel
  - analytics
  - devtools
  - debugging

screenshots:
  - description: The Mixpanel tab in Flutter DevTools, with the live event list and the property table.
    path: doc/images/mixpanel_tab.png

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  devtools_app_shared: ^0.5.1
  devtools_extensions: ^0.5.1
  flutter:
    sdk: flutter
  vm_service: ">=14.0.0 <16.0.0"
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
